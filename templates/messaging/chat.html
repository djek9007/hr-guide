{% extends 'base.html' %}
{% load i18n %}
{% load static %}

{% block title %}{% trans "Чат" %} - {% trans "Справочник Министерства культуры и информации Республики Казахстан" %}{% endblock %}

{% block extra_js %}
<script src="{% static 'vendor/alpine.min.js' %}" defer></script>
{% endblock %}

{% block content %}
<script id="current-user-data" type="application/json">{{ current_user|safe }}</script>
<div x-data="chatApp()" x-init="init()" class="h-[calc(100vh-200px)] flex overflow-hidden">
    <!-- Левая панель со списком сотрудников -->
    <div class="w-80 bg-white border-r border-gray-200 flex flex-col overflow-hidden">
        <!-- Заголовок с ФИО пользователя и выходом -->
        <div class="p-4 border-b border-gray-200 bg-gray-50">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-user text-blue-600"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-semibold text-gray-800 truncate" x-text="currentUser?.contact_info?.full_name || currentUser?.username || 'Пользователь'"></h3>
                        <p class="text-xs text-gray-500 truncate" x-text="currentUser?.contact_info?.position || ''"></p>
                    </div>
                </div>
                <a 
                    href="{% url 'logout' %}"
                    class="ml-2 px-3 py-1.5 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors flex items-center gap-1.5"
                    title="{% trans 'Выход' %}"
                >
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="hidden sm:inline">{% trans "Выход" %}</span>
                </a>
            </div>
            <!-- Поиск сотрудников -->
            <input 
                type="text"
                x-model="searchQuery"
                @input="filterEmployees()"
                placeholder="{% trans 'Поиск сотрудников...' %}"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>
        
        <!-- Список сотрудников -->
        <div class="flex-1 overflow-y-auto">
            <template x-if="filteredEmployees.length === 0">
                <div class="p-4 text-center text-gray-500">
                    <i class="fas fa-users text-4xl mb-2 opacity-30"></i>
                    <p class="text-sm">{% trans "Сотрудники не найдены" %}</p>
                </div>
            </template>
            <template x-for="(employee, index) in (filteredEmployees || [])" :key="`emp-${employee?.id || index}-${index}`">
                <template x-if="employee">
                    <div 
                        @click="selectEmployee(employee)"
                        :class="{
                            'bg-blue-50 border-l-4 border-blue-600': selectedEmployeeId === employee?.id,
                            'bg-yellow-50 border-l-4 border-yellow-500 animate-pulse': selectedEmployeeId !== employee?.id && employee.hasUnread,
                            'hover:bg-gray-50': selectedEmployeeId !== employee?.id && !employee.hasUnread
                        }"
                        class="p-3 border-b border-gray-100 cursor-pointer transition-colors"
                    >
                        <div class="flex items-center gap-3">
                            <div 
                                :class="employee.hasUnread && selectedEmployeeId !== employee?.id ? 'bg-yellow-200' : 'bg-blue-100'"
                                class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"
                            >
                                <i :class="employee.hasUnread && selectedEmployeeId !== employee?.id ? 'fas fa-envelope text-yellow-700' : 'fas fa-user text-blue-600'"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 
                                    :class="employee.hasUnread && selectedEmployeeId !== employee?.id ? 'font-bold text-yellow-900' : 'font-semibold text-gray-800'"
                                    class="truncate"
                                    x-text="employee.contact_info?.full_name || employee.username || 'Пользователь'"
                                ></h3>
                                <p class="text-xs text-gray-500 truncate" x-text="employee.contact_info?.position || ''"></p>
                            </div>
                            <template x-if="employee?.id && employee.hasUnread">
                                <span 
                                    :class="selectedEmployeeId === employee?.id ? 'bg-blue-600' : 'bg-yellow-600 animate-pulse'"
                                    class="px-2 py-0.5 text-white text-xs rounded-full font-bold"
                                    x-text="employee.unreadCount || (employee.isBlinking ? '!' : '')"
                                ></span>
                            </template>
                        </div>
                    </div>
                </template>
            </template>
        </div>
    </div>

    <!-- Правая панель - область чата -->
    <div class="flex-1 bg-white flex flex-col overflow-hidden">
        <template x-if="!currentChatId">
            <div class="flex-1 flex items-center justify-center text-gray-500">
                <div class="text-center">
                    <i class="fas fa-comments text-6xl mb-4 opacity-30"></i>
                    <p class="text-lg">{% trans "Выберите сотрудника для начала общения" %}</p>
                </div>
            </div>
        </template>
        
        <template x-if="currentChatId">
            <div class="flex-1 flex flex-col h-full">
                <!-- Заголовок чата -->
                <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-blue-600"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-800" x-text="selectedEmployee?.contact_info?.full_name || selectedEmployee?.username || 'Пользователь'"></h3>
                            <p class="text-xs text-gray-500" x-text="selectedEmployee?.contact_info?.position || ''"></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <template x-if="isTyping">
                            <span class="text-sm text-gray-500 italic">{% trans "Печатает..." %}</span>
                        </template>
                    </div>
                </div>

                <!-- Сообщения -->
                <div 
                    x-ref="messagesContainer"
                    class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50"
                >
                    <!-- Отладочная информация (можно удалить позже) -->
                    <template x-if="!messages || messages.length === 0">
                        <div class="text-center text-gray-500 py-8">
                            <i class="fas fa-comments text-4xl mb-2 opacity-30"></i>
                            <p class="text-sm">{% trans "Нет сообщений" %}</p>
                            <p class="text-xs mt-2" x-text="'Chat ID: ' + currentChatId"></p>
                        </div>
                    </template>
                    <!-- Отладочная информация о количестве сообщений -->
                    <template x-if="messages && messages.length > 0">
                        <div class="text-xs text-gray-400 mb-2 px-2">
                            <span x-text="'Всего сообщений: ' + messages.length"></span>
                            <span class="ml-2" x-text="'Отображаемых: ' + (messages.filter(m => m && m.id && (m.text || (m.attachments && m.attachments.length > 0))).length)"></span>
                        </div>
                    </template>
                    <template x-for="(message, index) in (messages || [])" :key="`msg-${message?.id || index}-${index}`">
                        <template x-if="message && message.id && (message.text || (message.attachments && message.attachments.length > 0))">
                            <div>
                                <div 
                                    :class="message.sender?.id === currentUser?.id ? 'flex justify-end' : 'flex justify-start'"
                                >
                                    <div 
                                        :class="message.sender?.id === currentUser?.id ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border border-gray-200'"
                                        class="rounded-lg p-3 max-w-[70%] shadow-sm"
                                    >
                                        <p class="text-sm whitespace-pre-wrap" x-text="message.text || '(пустое сообщение)'"></p>
                                        <div class="flex items-center justify-end gap-2 mt-2">
                                            <span 
                                                :class="message.sender?.id === currentUser?.id ? 'text-blue-100' : 'text-gray-500'"
                                                class="text-xs"
                                                x-text="formatTime(message.created_at)"
                                            ></span>
                                            <template x-if="message.sender?.id === currentUser?.id && message.is_read">
                                                <i class="fas fa-check-double text-blue-100 text-xs"></i>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <!-- Вложения -->
                                <template x-if="message.attachments && Array.isArray(message.attachments) && message.attachments.length > 0">
                                    <div 
                                        :class="message.sender?.id === currentUser?.id ? 'flex justify-end' : 'flex justify-start'"
                                        class="mt-1"
                                    >
                                        <div class="space-y-2 max-w-[70%]">
                                            <template x-for="(attachment, attIndex) in message.attachments" :key="`att-${attachment?.id || attIndex}-${attIndex}`">
                                                <template x-if="attachment">
                                                    <a 
                                                        :href="attachment.file_url || '#'"
                                                        target="_blank"
                                                        class="block p-2 bg-white rounded border border-gray-200 hover:bg-gray-50 transition-colors shadow-sm"
                                                    >
                                                        <div class="flex items-center gap-2">
                                                            <i class="fas fa-file text-gray-400"></i>
                                                            <span class="text-sm text-gray-700 truncate" x-text="attachment.original_filename || ''"></span>
                                                            <span class="text-xs text-gray-500 ml-auto flex-shrink-0" x-text="(attachment.file_size_mb || 0) + ' МБ'"></span>
                                                        </div>
                                                    </a>
                                                </template>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>
                </div>

                <!-- Форма отправки сообщения -->
                <div class="p-4 border-t border-gray-200 bg-white">
                    <form @submit.prevent="sendMessage()" class="flex gap-2">
                        <input 
                            type="file"
                            x-ref="fileInput"
                            @change="handleFileSelect"
                            multiple
                            class="hidden"
                        >
                        <button 
                            type="button"
                            @click="$refs.fileInput.click()"
                            class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors"
                            title="{% trans 'Прикрепить файл' %}"
                        >
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input 
                            type="text"
                            x-model="messageText"
                            @input="handleTyping()"
                            @keydown.enter.prevent="sendMessage()"
                            placeholder="{% trans 'Введите сообщение...' %}"
                            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                        <button 
                            type="submit"
                            :disabled="!messageText.trim() && selectedFiles.length === 0"
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                            title="{% trans 'Отправить сообщение' %}"
                        >
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                    <!-- Выбранные файлы -->
                    <template x-if="selectedFiles.length > 0">
                        <div class="mt-2 flex flex-wrap gap-2">
                            <template x-for="(file, index) in (selectedFiles || [])" :key="`file-${index}`">
                                <template x-if="file">
                                    <div class="flex items-center gap-2 px-3 py-1 bg-gray-100 rounded border border-gray-200">
                                        <i class="fas fa-file text-gray-400"></i>
                                        <span class="text-sm text-gray-700" x-text="file.name || ''"></span>
                                        <button 
                                            @click="removeFile(index)"
                                            class="text-red-500 hover:text-red-700"
                                        >
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </template>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>

<script>
function chatApp() {
    return {
        employees: [], // Список всех сотрудников
        filteredEmployees: [], // Отфильтрованный список сотрудников
        chats: [], // Кэш чатов для быстрого доступа
        chatsByEmployeeId: {}, // Маппинг employee_id -> chat
        currentChatId: null,
        selectedEmployeeId: null,
        selectedEmployee: null,
        messages: [], // Массив сообщений текущего чата
        messageText: '',
        selectedFiles: [],
        searchQuery: '',
        currentUser: null,
        ws: null,
        isTyping: false,
        typingTimeout: null,
        messagePollInterval: null, // Интервал для периодической загрузки сообщений, если WebSocket не работает
        wsConnected: false, // Флаг подключения WebSocket
        blinkingChats: new Set(), // Множество ID чатов, которые должны моргать
        
        // Метод для проверки, должен ли чат моргать
        isChatBlinking(chatId) {
            return this.blinkingChats.has(chatId);
        }

        async init() {
            // Получаем текущего пользователя
            await this.loadCurrentUser();
            
            // Загружаем список всех сотрудников
            await this.loadEmployees();
            
            // Загружаем существующие чаты для отображения непрочитанных сообщений
            await this.loadChats();
            
            // Подключаемся к WebSocket
            this.connectWebSocket();
            
            // Если через 5 секунд WebSocket не подключился, запускаем polling
            setTimeout(() => {
                if (!this.wsConnected && this.currentChatId && !this.messagePollInterval) {
                    console.log('WebSocket не подключился, запускаем периодическую загрузку сообщений');
                    this.startMessagePolling();
                }
            }, 5000);
        },

        async loadCurrentUser() {
            try {
                const response = await fetch('/api/users/me/', {
                    credentials: 'include'
                });
                if (response.ok) {
                    this.currentUser = await response.json();
                } else {
                    // Используем данные из контекста шаблона
                    const userDataElement = document.getElementById('current-user-data');
                    if (userDataElement) {
                        this.currentUser = JSON.parse(userDataElement.textContent);
                    } else {
                        this.currentUser = { id: 0, username: '' };
                    }
                }
            } catch (error) {
                console.error('Error loading current user:', error);
                // Используем данные из контекста шаблона
                const userDataElement = document.getElementById('current-user-data');
                if (userDataElement) {
                    this.currentUser = JSON.parse(userDataElement.textContent);
                } else {
                    this.currentUser = { id: 0, username: '' };
                }
            }
        },

        async loadEmployees() {
            try {
                // Загружаем всех сотрудников (пользователей с Contact)
                const response = await fetch('/api/users/', {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    // Обрабатываем пагинацию и фильтруем null значения
                    const allEmployees = Array.isArray(data) ? data : (data.results || []);
                    // Фильтруем текущего пользователя из списка и null значения
                    this.employees = allEmployees.filter(emp => emp != null && emp.id !== this.currentUser?.id);
                    this.filteredEmployees = this.employees;
                } else {
                    this.employees = [];
                    this.filteredEmployees = [];
                }
            } catch (error) {
                console.error('Error loading employees:', error);
                this.employees = [];
                this.filteredEmployees = [];
            }
        },

        async loadChats() {
            try {
                const response = await fetch('/api/chats/', {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    // Обрабатываем пагинацию: API может вернуть объект с results или массив напрямую
                    this.chats = Array.isArray(data) ? data : (data.results || []);
                    // Создаем маппинг employee_id -> chat
                    this.chatsByEmployeeId = {};
                    this.chats.forEach(chat => {
                        const otherParticipant = chat.other_participant;
                        if (otherParticipant) {
                            this.chatsByEmployeeId[otherParticipant.id] = chat;
                        }
                    });
                    // Обновляем отфильтрованный список сотрудников с учетом новых данных о чатах
                    this.filterEmployees();
                }
            } catch (error) {
                console.error('Error loading chats:', error);
                // Устанавливаем пустой массив в случае ошибки
                this.chats = [];
            }
        },

        filterEmployees() {
            let employees = Array.isArray(this.employees) ? this.employees : [];
            
            // Применяем поиск, если есть запрос
            if (this.searchQuery.trim()) {
                const query = this.searchQuery.toLowerCase();
                employees = employees.filter(emp => {
                    if (!emp) return false;
                    const fullName = (emp.contact_info?.full_name || emp.username || '').toLowerCase();
                    const position = (emp.contact_info?.position || '').toLowerCase();
                    return fullName.includes(query) || position.includes(query);
                });
            }
            
            // Сортируем сотрудников: сначала с непрочитанными сообщениями, затем по дате последнего сообщения
            this.filteredEmployees = employees.map(emp => {
                const chat = this.chatsByEmployeeId[emp.id];
                const isBlinking = chat && this.blinkingChats.has(chat.id);
                const unreadCount = chat?.unread_count || 0;
                return {
                    ...emp,
                    chat: chat,
                    lastMessageAt: chat?.last_message_at || null,
                    unreadCount: unreadCount,
                    isBlinking: isBlinking,
                    hasUnread: unreadCount > 0 || isBlinking
                };
            }).sort((a, b) => {
                // Сначала чаты с непрочитанными сообщениями или моргающие
                if (a.hasUnread && !b.hasUnread) return -1;
                if (!a.hasUnread && b.hasUnread) return 1;
                
                // Если оба имеют непрочитанные, сначала моргающие
                if (a.hasUnread && b.hasUnread) {
                    if (a.isBlinking && !b.isBlinking) return -1;
                    if (!a.isBlinking && b.isBlinking) return 1;
                }
                
                // Затем по дате последнего сообщения (новые сверху)
                if (a.lastMessageAt && b.lastMessageAt) {
                    return new Date(b.lastMessageAt) - new Date(a.lastMessageAt);
                }
                if (a.lastMessageAt) return -1;
                if (b.lastMessageAt) return 1;
                
                // Если нет сообщений, сортируем по имени
                const nameA = (a.contact_info?.full_name || a.username || '').toLowerCase();
                const nameB = (b.contact_info?.full_name || b.username || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });
            
            console.log('Отфильтровано сотрудников:', this.filteredEmployees.length);
            const withUnread = this.filteredEmployees.filter(e => e.hasUnread);
            if (withUnread.length > 0) {
                console.log('Сотрудники с непрочитанными:', withUnread.map(e => ({
                    name: e.contact_info?.full_name || e.username,
                    unread: e.unreadCount,
                    blinking: e.isBlinking
                })));
            }
        },

        async selectEmployee(employee) {
            this.selectedEmployeeId = employee.id;
            this.selectedEmployee = employee;
            
            // Проверяем, есть ли уже чат с этим сотрудником
            let chat = this.chatsByEmployeeId[employee.id];
            
            if (!chat) {
                // Создаем новый чат
                try {
                    const response = await fetch(`/api/chats/get_or_create/?user_id=${employee.id}`, {
                        credentials: 'include'
                    });
                    if (response.ok) {
                        chat = await response.json();
                        this.chatsByEmployeeId[employee.id] = chat;
                        // Обновляем список чатов
                        await this.loadChats();
                    } else {
                        console.error('Error creating chat');
                        return;
                    }
                } catch (error) {
                    console.error('Error creating chat:', error);
                    return;
                }
            }
            
            this.currentChatId = chat.id;
            console.log('✅ Открыт чат с ID:', chat.id, 'для сотрудника:', employee.id, 'currentChatId установлен:', this.currentChatId);
            
            // Останавливаем периодическую загрузку для предыдущего чата
            if (this.messagePollInterval) {
                clearInterval(this.messagePollInterval);
                this.messagePollInterval = null;
            }
            
            // Очищаем текущие сообщения перед загрузкой новых
            this.messages = [];
            console.log('Сообщения очищены, начинаем загрузку...');
            
            // Загружаем сообщения (все, включая новые)
            await this.loadMessages(chat.id);
            
            console.log('Сообщения загружены. Всего в UI:', this.messages.length, 'currentChatId:', this.currentChatId);
            
            // Отмечаем сообщения как прочитанные
            await this.markChatAsRead(chat.id);
            
            // Обновляем список чатов после открытия, чтобы обновить счетчики
            console.log('Обновляем список чатов... currentChatId до loadChats:', this.currentChatId);
            await this.loadChats();
            console.log('Список чатов обновлен. currentChatId после loadChats:', this.currentChatId);
            
            // Если WebSocket не подключен, запускаем периодическую загрузку сообщений
            if (!this.wsConnected && !this.messagePollInterval) {
                this.startMessagePolling();
            }
        },

        getUnreadCount(employeeId) {
            const chat = this.chatsByEmployeeId[employeeId];
            return chat ? (chat.unread_count || 0) : 0;
        },

        async loadMessages(chatId, retryCount = 0) {
            const maxRetries = 3;
            const retryDelay = 1000; // 1 секунда
            
            try {
                console.log('Загрузка сообщений для чата:', chatId);
                
                // Создаем AbortController для таймаута
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 секунд таймаут
                
                const response = await fetch(`/api/messages/?chat_id=${chatId}`, {
                    credentials: 'include',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    const data = await response.json();
                    // Фильтруем null/undefined значения и гарантируем, что это массив
                    const messagesArray = (Array.isArray(data) ? data : (data.results || [])).filter(msg => msg != null && msg.id);
                    console.log(`Загружено сообщений для чата ${chatId}:`, messagesArray.length);
                    
                    // Логируем информацию о сообщениях
                    if (messagesArray.length > 0) {
                        console.log('📋 Первое сообщение:', {
                            id: messagesArray[0].id,
                            sender: messagesArray[0].sender?.username || messagesArray[0].sender?.id,
                            sender_id: messagesArray[0].sender?.id,
                            text: messagesArray[0].text?.substring(0, 30),
                            created_at: messagesArray[0].created_at
                        });
                        console.log('📋 Последнее сообщение:', {
                            id: messagesArray[messagesArray.length - 1].id,
                            sender: messagesArray[messagesArray.length - 1].sender?.username || messagesArray[messagesArray.length - 1].sender?.id,
                            sender_id: messagesArray[messagesArray.length - 1].sender?.id,
                            text: messagesArray[messagesArray.length - 1].text?.substring(0, 30),
                            created_at: messagesArray[messagesArray.length - 1].created_at
                        });
                        
                        // Подсчитываем сообщения от текущего пользователя и от других
                        const fromCurrentUser = messagesArray.filter(m => m.sender?.id === this.currentUser?.id).length;
                        const fromOthers = messagesArray.length - fromCurrentUser;
                        console.log(`📊 Статистика: от текущего пользователя (ID: ${this.currentUser?.id}): ${fromCurrentUser}, от других: ${fromOthers}`);
                        
                        // Показываем все отправители
                        const senders = [...new Set(messagesArray.map(m => m.sender?.id).filter(id => id))];
                        console.log('👥 Уникальные отправители в чате:', senders);
                    } else {
                        console.warn('⚠️ Нет сообщений в ответе API для чата', chatId);
                    }
                    
                    // Сортируем сообщения по дате создания (старые первыми)
                    messagesArray.sort((a, b) => {
                        const dateA = new Date(a.created_at || 0);
                        const dateB = new Date(b.created_at || 0);
                        return dateA - dateB;
                    });
                    
                    // Заменяем все сообщения новыми (не добавляем, а заменяем)
                    this.messages = messagesArray;
                    console.log(`✅ Сообщения установлены в UI для чата ${chatId}. Всего: ${this.messages.length}`);
                    
                    // Проверяем, что сообщения действительно установлены
                    if (this.messages.length === 0) {
                        console.warn('⚠️ Массив сообщений пуст после установки!');
                    } else {
                        // Проверяем, что сообщения можно отобразить
                        const displayableMessages = this.messages.filter(m => m && m.id && (m.text || m.attachments?.length > 0));
                        console.log(`✅ Готово к отображению сообщений: ${displayableMessages.length} из ${this.messages.length}`);
                    }
                    
                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });
                } else if (response.status >= 500 && retryCount < maxRetries) {
                    // Повторяем запрос при серверных ошибках
                    console.log(`Повторная попытка загрузки сообщений (${retryCount + 1}/${maxRetries})...`);
                    await new Promise(resolve => setTimeout(resolve, retryDelay * (retryCount + 1)));
                    return this.loadMessages(chatId, retryCount + 1);
                } else {
                    const errorText = await response.text().catch(() => 'Не удалось прочитать ответ');
                    console.error('Ошибка загрузки сообщений:', response.status, response.statusText, errorText);
                    // В случае ошибки не очищаем сообщения, оставляем существующие
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.error('Таймаут загрузки сообщений');
                    // Повторяем при таймауте
                    if (retryCount < maxRetries) {
                        console.log(`Повторная попытка загрузки сообщений после таймаута (${retryCount + 1}/${maxRetries})...`);
                        await new Promise(resolve => setTimeout(resolve, retryDelay * (retryCount + 1)));
                        return this.loadMessages(chatId, retryCount + 1);
                    }
                } else if (error.name === 'TypeError' && (error.message.includes('Failed to fetch') || error.message.includes('ERR_EMPTY_RESPONSE'))) {
                    console.error('Ошибка сети при загрузке сообщений:', error);
                    // Повторяем при сетевых ошибках
                    if (retryCount < maxRetries) {
                        console.log(`Повторная попытка загрузки сообщений после сетевой ошибки (${retryCount + 1}/${maxRetries})...`);
                        await new Promise(resolve => setTimeout(resolve, retryDelay * (retryCount + 1)));
                        return this.loadMessages(chatId, retryCount + 1);
                    }
                } else {
                    console.error('Ошибка загрузки сообщений:', error);
                }
                // В случае ошибки не очищаем сообщения, оставляем существующие
            }
        },

        async sendMessage() {
            if (!this.messageText.trim() && this.selectedFiles.length === 0) {
                return;
            }

            const chatId = this.currentChatId;
            const text = this.messageText.trim();

            // Очищаем поля ввода сразу для лучшего UX
            const messageTextToSend = this.messageText.trim();
            this.messageText = '';
            const filesToSend = [...this.selectedFiles];
            this.selectedFiles = [];

            // Если есть файлы, отправляем через API (файлы всегда через API)
            if (filesToSend.length > 0) {
                await this.uploadFiles(chatId, messageTextToSend, filesToSend);
                return;
            }

            // Для текстовых сообщений: пробуем WebSocket, если недоступен - используем API
            let messageSent = false;

            // Пытаемся отправить через WebSocket
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                try {
                    this.ws.send(JSON.stringify({
                        type: 'chat_message',
                        chat_id: chatId,
                        text: messageTextToSend
                    }));
                    messageSent = true;
                    // Сообщение будет добавлено в UI через WebSocket onmessage
                    // Но на случай, если WebSocket не доставит сообщение, добавим временное
                    const tempMessageId = 'temp_ws_' + Date.now();
                    const tempMessage = {
                        id: tempMessageId,
                        chat: chatId,
                        text: messageTextToSend,
                        sender: this.currentUser,
                        created_at: new Date().toISOString(),
                        is_read: false,
                        attachments: []
                    };
                    if (!Array.isArray(this.messages)) {
                        this.messages = [];
                    }
                    this.messages.push(tempMessage);
                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });
                    // Удалим временное сообщение через 5 секунд, если реальное не пришло
                    setTimeout(() => {
                        const tempIndex = this.messages.findIndex(msg => msg && msg.id === tempMessageId);
                        if (tempIndex !== -1) {
                            // Проверяем, не пришло ли уже реальное сообщение с таким текстом
                            const realMessage = this.messages.find(msg => 
                                msg && 
                                msg.id !== tempMessageId && 
                                msg.text === messageTextToSend && 
                                msg.sender?.id === this.currentUser?.id
                            );
                            if (!realMessage) {
                                // Реальное сообщение не пришло, возможно WebSocket не сработал
                                // Отправляем через API
                                this.sendMessageViaAPI(chatId, messageTextToSend);
                            }
                            // Удаляем временное сообщение в любом случае
                            this.messages.splice(tempIndex, 1);
                        }
                    }, 5000);
                } catch (error) {
                    console.error('Ошибка отправки через WebSocket:', error);
                    messageSent = false;
                }
            }

            // Если WebSocket недоступен или произошла ошибка, отправляем через API
            if (!messageSent) {
                await this.sendMessageViaAPI(chatId, messageTextToSend);
            }
        },

        async sendMessageViaAPI(chatId, text) {
            // Создаем временное сообщение для оптимистичного обновления UI
            const tempMessageId = 'temp_' + Date.now();
            const tempMessage = {
                id: tempMessageId,
                chat: chatId,
                text: text,
                sender: this.currentUser,
                created_at: new Date().toISOString(),
                is_read: false,
                attachments: []
            };

            // Инициализируем messages как массив, если он undefined
            if (!Array.isArray(this.messages)) {
                this.messages = [];
            }
            
            // Добавляем временное сообщение
            this.messages.push(tempMessage);
            this.$nextTick(() => {
                this.scrollToBottom();
            });

            try {
                const response = await fetch('/api/messages/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCsrfToken()
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        chat: chatId,
                        text: text
                    })
                });

                if (response.ok) {
                    const message = await response.json();
                    // Удаляем временное сообщение
                    const tempIndex = this.messages.findIndex(msg => msg && msg.id === tempMessageId);
                    if (tempIndex !== -1) {
                        this.messages.splice(tempIndex, 1);
                    }
                    // Добавляем реальное сообщение, если его еще нет
                    if (message && message.id && !this.messages.find(msg => msg && msg.id === message.id)) {
                        this.messages.push(message);
                        this.$nextTick(() => {
                            this.scrollToBottom();
                        });
                    }
                } else {
                    console.error('Ошибка отправки сообщения через API:', response.status);
                    // Удаляем временное сообщение при ошибке
                    const tempIndex = this.messages.findIndex(msg => msg && msg.id === tempMessageId);
                    if (tempIndex !== -1) {
                        this.messages.splice(tempIndex, 1);
                    }
                    // Восстанавливаем текст сообщения для повторной попытки
                    this.messageText = text;
                }
            } catch (error) {
                console.error('Ошибка отправки сообщения через API:', error);
                // Удаляем временное сообщение при ошибке
                const tempIndex = this.messages.findIndex(msg => msg && msg.id === tempMessageId);
                if (tempIndex !== -1) {
                    this.messages.splice(tempIndex, 1);
                }
                // Восстанавливаем текст сообщения для повторной попытки
                this.messageText = text;
            }
        },

        async uploadFiles(chatId, text, files) {
            const formData = new FormData();
            formData.append('chat', chatId);
            if (text) {
                formData.append('text', text);
            }

            files.forEach((file, index) => {
                formData.append(`file_${index}`, file);
            });

            try {
                const response = await fetch('/api/messages/', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include',
                    headers: {
                        'X-CSRFToken': this.getCsrfToken()
                    }
                });

                if (response.ok) {
                    const message = await response.json();
                    // Инициализируем messages как массив, если он undefined
                    if (!Array.isArray(this.messages)) {
                        this.messages = [];
                    }
                    // Проверяем, что сообщение не null и не дублируется
                    if (message && message.id && !this.messages.find(msg => msg && msg.id === message.id)) {
                        this.messages.push(message);
                        this.$nextTick(() => {
                            this.scrollToBottom();
                        });
                    }
                }
            } catch (error) {
                console.error('Error uploading files:', error);
            }
        },

        handleFileSelect(event) {
            const files = Array.from(event.target.files);
            this.selectedFiles.push(...files);
        },

        removeFile(index) {
            this.selectedFiles.splice(index, 1);
        },


        async markChatAsRead(chatId) {

                await fetch(`/api/chats/${chatId}/mark_read/`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'X-CSRFToken': this.getCsrfToken()
                    }
                });
            } catch (error) {
                console.error('Error marking chat as read:', error);
            }
        },

        connectWebSocket() {
            // Определяем правильный протокол и хост для WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            // Используем тот же хост, что и для HTTP запросов
            const wsUrl = `${protocol}//${window.location.host}/ws/chat/`;
            
            console.log('Подключение к WebSocket:', wsUrl);
            
            // Закрываем предыдущее соединение, если оно есть
            if (this.ws) {
                try {
                    this.ws.close();
                } catch (e) {
                    // Игнорируем ошибки при закрытии
                }
            }
            
            this.ws = new WebSocket(wsUrl);

            this.ws.onopen = () => {
                console.log('WebSocket connected');
                this.wsConnected = true;
                // Останавливаем периодическую загрузку сообщений, если WebSocket работает
                if (this.messagePollInterval) {
                    clearInterval(this.messagePollInterval);
                    this.messagePollInterval = null;
                }
            };

            this.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'chat_message') {
                        // Проверяем, относится ли сообщение к текущему чату или любому чату пользователя
                        if (data.chat_id && data.message) {
                            // Нормализуем ID для сравнения (могут быть строки или числа)
                            const receivedChatId = parseInt(data.chat_id);
                            const currentChatIdNum = this.currentChatId ? parseInt(this.currentChatId) : null;
                            
                            console.log('📨 Получено сообщение через WebSocket:', {
                                chat_id: receivedChatId,
                                currentChatId: currentChatIdNum,
                                message_id: data.message?.id,
                                sender_id: data.message?.sender?.id,
                                sender_username: data.message?.sender?.username,
                                text: data.message?.text?.substring(0, 30),
                                messages_count: this.messages?.length || 0
                            });
                            
                            // Проверяем, есть ли этот чат в списке открытых чатов пользователя
                            const chatExists = this.chats.find(c => c.id === receivedChatId);
                            
                            // Проверяем, есть ли сообщения для этого чата (независимо от currentChatId)
                            // Это основной способ определить, открыт ли чат
                            const hasMessagesForThisChat = this.messages.length > 0 && 
                                                          this.messages.some(m => {
                                                              const msgChatId = m.chat ? (typeof m.chat === 'object' ? m.chat.id : parseInt(m.chat)) : null;
                                                              return msgChatId === receivedChatId;
                                                          });
                            
                            // Если currentChatId не установлен, но есть загруженные сообщения для этого чата,
                            // значит чат был открыт, но currentChatId по какой-то причине сброшен
                            const shouldAddToCurrentChat = currentChatIdNum === null && hasMessagesForThisChat;
                            
                            console.log('🔍 Проверка сообщения:', {
                                receivedChatId,
                                currentChatIdNum,
                                shouldAddToCurrentChat,
                                hasMessagesForThisChat,
                                messages_count: this.messages.length
                            });
                            
                            // Если это сообщение для текущего открытого чата, добавляем его
                            // Проверяем: currentChatId совпадает ИЛИ есть сообщения для этого чата
                            const shouldAdd = receivedChatId === currentChatIdNum || shouldAddToCurrentChat || hasMessagesForThisChat;
                            
                            if (shouldAdd) {
                                // Если currentChatId был null, но сообщения для этого чата уже есть, восстанавливаем currentChatId
                                if (this.currentChatId === null && (shouldAddToCurrentChat || hasMessagesForThisChat)) {
                                    console.log('🔧 Восстанавливаем currentChatId:', receivedChatId, '(найдены сообщения для этого чата)');
                                    this.currentChatId = receivedChatId;
                                }
                                
                                console.log('✅ Сообщение для открытого чата, добавляем в UI. Причина:', {
                                    currentChatIdMatch: receivedChatId === currentChatIdNum,
                                    shouldAddToCurrentChat,
                                    hasMessagesForThisChat
                                });
                                // Инициализируем messages как массив, если он undefined
                                if (!Array.isArray(this.messages)) {
                                    this.messages = [];
                                }
                                // Проверяем, что сообщение не null и не дублируется
                                const messageId = data.message.id;
                                if (messageId && !this.messages.find(msg => msg && msg.id === messageId)) {
                                    // Удаляем временные сообщения с таким же текстом от текущего пользователя
                                    const messageText = data.message.text || '';
                                    const senderId = data.message.sender?.id;
                                    if (senderId === this.currentUser?.id && messageText) {
                                        this.messages = this.messages.filter(msg => {
                                            // Удаляем временные сообщения (начинаются с temp_) с таким же текстом
                                            if (msg && msg.id && msg.id.toString().startsWith('temp_')) {
                                                return msg.text !== messageText;
                                            }
                                            return true;
                                        });
                                    }
                                    // Добавляем реальное сообщение
                                    console.log('➕ Добавление сообщения в UI:', {
                                        id: data.message.id,
                                        sender: data.message.sender?.username || data.message.sender?.id,
                                        text: data.message.text?.substring(0, 30),
                                        current_messages_count: this.messages.length
                                    });
                                    this.messages.push(data.message);
                                    console.log('✅ Сообщение добавлено. Теперь всего сообщений:', this.messages.length);
                                    this.$nextTick(() => {
                                        this.scrollToBottom();
                                    });
                                } else {
                                    console.log('⚠️ Сообщение уже есть в списке или нет ID:', messageId);
                                }
                            } else {
                                console.log('⚠️ Сообщение для другого чата (текущий:', currentChatIdNum, ', получен:', receivedChatId, ')');
                                console.log('💡 Это означает, что чат не открыт. Сообщение будет показано при открытии чата или через периодическую загрузку.');
                                console.log('🔍 Детали проверки:', {
                                    receivedChatId,
                                    currentChatIdNum,
                                    shouldAddToCurrentChat,
                                    hasMessagesForThisChat,
                                    messages_count: this.messages.length,
                                    messages_chat_ids: this.messages.map(m => {
                                        const msgChatId = m.chat ? (typeof m.chat === 'object' ? m.chat.id : parseInt(m.chat)) : null;
                                        return msgChatId;
                                    }).filter(id => id !== null)
                                });
                                // Если чат не открыт, но сообщение пришло - добавляем в моргающие чаты
                                this.blinkingChats.add(receivedChatId);
                                console.log('Добавлен чат в моргающие:', data.chat_id, 'Всего моргающих:', Array.from(this.blinkingChats));
                                
                                // Обновляем счетчик непрочитанных для этого чата вручную
                                const chat = this.chats.find(c => c.id === data.chat_id);
                                if (chat) {
                                    // Увеличиваем счетчик непрочитанных
                                    if (!chat.unread_count) chat.unread_count = 0;
                                    chat.unread_count += 1;
                                    chat.last_message_at = data.message.created_at;
                                    console.log('Обновлен счетчик для чата:', data.chat_id, 'непрочитанных:', chat.unread_count);
                                }
                                
                                // Через 10 секунд убираем моргание (пользователь должен был заметить)
                                setTimeout(() => {
                                    this.blinkingChats.delete(data.chat_id);
                                    console.log('Убрано моргание для чата:', data.chat_id);
                                }, 10000);
                                
                                // Обновляем список чатов, чтобы показать непрочитанное сообщение и переместить чат наверх
                                await this.loadChats();
                                
                                // Принудительно обновляем маппинг после загрузки чатов
                                this.chatsByEmployeeId = {};
                                this.chats.forEach(chat => {
                                    const otherParticipant = chat.other_participant;
                                    if (otherParticipant) {
                                        this.chatsByEmployeeId[otherParticipant.id] = chat;
                                    }
                                });
                                
                                // Обновляем отфильтрованный список, чтобы чат с новым сообщением был сверху
                                this.filterEmployees();
                                console.log('Список сотрудников обновлен после получения нового сообщения. Моргающих чатов:', Array.from(this.blinkingChats).length);
                            }
                        }
                        // Обновляем список чатов для обновления счетчиков непрочитанных
                        // Это нужно делать всегда, чтобы обновить счетчики
                        await this.loadChats();
                        
                        // Принудительно обновляем маппинг после загрузки чатов
                        this.chatsByEmployeeId = {};
                        this.chats.forEach(chat => {
                            const otherParticipant = chat.other_participant;
                            if (otherParticipant) {
                                this.chatsByEmployeeId[otherParticipant.id] = chat;
                            }
                        });
                        
                        // Обновляем отфильтрованный список сотрудников
                        this.filterEmployees();
                    } else if (data.type === 'typing_indicator') {
                        if (data.chat_id === this.currentChatId) {
                            this.isTyping = data.is_typing;
                            if (data.is_typing) {
                                clearTimeout(this.typingTimeout);
                                this.typingTimeout = setTimeout(() => {
                                    this.isTyping = false;
                                }, 3000);
                            }
                        }
                    }
                } catch (error) {
                    console.error('Ошибка парсинга сообщения WebSocket:', error);
                }
            };

            this.ws.onerror = (error) => {
                console.error('Ошибка WebSocket:', error);
                this.wsConnected = false;
                // При ошибке WebSocket, сообщения будут отправляться через API fallback
                // Запускаем периодическую загрузку сообщений, если еще не запущена
                if (this.currentChatId && !this.messagePollInterval) {
                    this.startMessagePolling();
                }
            };

            this.ws.onclose = (event) => {
                console.log('WebSocket disconnected', event.code, event.reason);
                this.wsConnected = false;
                
                // Если WebSocket не работает, запускаем периодическую загрузку сообщений
                if (this.currentChatId && !this.messagePollInterval) {
                    console.log('WebSocket недоступен, запускаем периодическую загрузку сообщений');
                    this.startMessagePolling();
                }
                
                // Переподключение через 5 секунд, но только если это не было намеренное закрытие
                // И только если код ошибки указывает на проблему (не 1000 - нормальное закрытие)
                if (event.code !== 1000 && event.code !== 1001) {
                    setTimeout(() => {
                        // Проверяем, что мы все еще на странице чата перед переподключением
                        // И что WebSocket еще не подключен
                        if (this.currentChatId !== null && !this.wsConnected) {
                            console.log('Попытка переподключения WebSocket...');
                            this.connectWebSocket();
                        }
                    }, 5000); // Увеличено с 3 до 5 секунд
                }
            };
        },

        handleTyping() {
            if (this.ws && this.ws.readyState === WebSocket.OPEN && this.currentChatId) {
                this.ws.send(JSON.stringify({
                    type: 'typing',
                    chat_id: this.currentChatId,
                    is_typing: true
                }));

                clearTimeout(this.typingTimeout);
                this.typingTimeout = setTimeout(() => {
                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(JSON.stringify({
                            type: 'typing',
                            chat_id: this.currentChatId,
                            is_typing: false
                        }));
                    }
                }, 1000);
            }
        },

        scrollToBottom() {
            const container = this.$refs.messagesContainer;
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        },

        formatTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            
            if (minutes < 1) return '{% trans "Только что" %}';
            if (minutes < 60) return `${minutes} {% trans "мин назад" %}`;
            if (minutes < 1440) return `${Math.floor(minutes / 60)} {% trans "ч назад" %}`;
            
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        },

        getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'csrftoken') {
                    return value;
                }
            }
            return '';
        },

        startMessagePolling() {
            // Периодически загружаем сообщения, если WebSocket не работает
            if (this.messagePollInterval) {
                return; // Уже запущена
            }
            
            console.log('Запуск периодической загрузки сообщений (каждые 5 секунд)');
            let isPolling = false; // Флаг для предотвращения параллельных запросов
            
            this.messagePollInterval = setInterval(async () => {
                // Предотвращаем параллельные запросы
                if (isPolling) {
                    console.log('Загрузка сообщений уже выполняется, пропускаем...');
                    return;
                }
                
                if (this.currentChatId && !this.wsConnected) {
                    isPolling = true;
                    try {
                        // Сохраняем количество сообщений до загрузки
                        const previousCount = this.messages ? this.messages.length : 0;
                        await this.loadMessages(this.currentChatId);
                        // Если появились новые сообщения, прокручиваем вниз
                        if (this.messages && this.messages.length > previousCount) {
                            this.$nextTick(() => {
                                this.scrollToBottom();
                            });
                        }
                    } finally {
                        isPolling = false;
                    }
                } else if (this.wsConnected) {
                    // WebSocket подключен, останавливаем polling
                    clearInterval(this.messagePollInterval);
                    this.messagePollInterval = null;
                    console.log('WebSocket подключен, периодическая загрузка остановлена');
                }
            }, 5000); // Загружаем каждые 5 секунд (увеличено с 3 до 5 для снижения нагрузки)
        }
    }
}
</script>
