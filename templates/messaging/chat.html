{% extends 'base.html' %}
{% load i18n %}
{% load static %}

{% block title %}{% trans "Чат" %} - {% trans "Справочник Министерства культуры и информации Республики Казахстан" %}{% endblock %}

{% block extra_js %}
<script src="{% static 'vendor/alpine.min.js' %}" defer></script>
{% endblock %}

{% block content %}
<script id="current-user-data" type="application/json">{{ current_user|safe }}</script>
<div x-data="chatApp()" x-init="init()" class="h-[calc(100vh-200px)] flex overflow-hidden">
    <!-- Левая панель со списком сотрудников -->
    <div class="w-80 bg-white border-r border-gray-200 flex flex-col overflow-hidden">
        <!-- Заголовок с ФИО пользователя и выходом -->
        <div class="p-4 border-b border-gray-200 bg-gray-50">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-user text-blue-600"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-semibold text-gray-800 truncate" x-text="currentUser?.contact_info?.full_name || currentUser?.username || 'Пользователь'"></h3>
                        <p class="text-xs text-gray-500 truncate" x-text="currentUser?.contact_info?.position || ''"></p>
                    </div>
                </div>
                <a 
                    href="{% url 'logout' %}"
                    class="ml-2 px-3 py-1.5 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors flex items-center gap-1.5"
                    title="{% trans 'Выход' %}"
                >
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="hidden sm:inline">{% trans "Выход" %}</span>
                </a>
            </div>
            <!-- Поиск сотрудников -->
            <input 
                type="text"
                x-model="searchQuery"
                @input="filterEmployees()"
                placeholder="{% trans 'Поиск сотрудников...' %}"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>
        
        <!-- Список сотрудников -->
        <div class="flex-1 overflow-y-auto">
            <template x-if="filteredEmployees.length === 0">
                <div class="p-4 text-center text-gray-500">
                    <i class="fas fa-users text-4xl mb-2 opacity-30"></i>
                    <p class="text-sm">{% trans "Сотрудники не найдены" %}</p>
                </div>
            </template>
            <template x-for="(employee, index) in (filteredEmployees || [])" :key="`emp-${employee?.id || index}-${index}`">
                <template x-if="employee">
                    <div 
                        @click="selectEmployee(employee)"
                        :class="{'bg-blue-50 border-l-4 border-blue-600': selectedEmployeeId === employee?.id, 'hover:bg-gray-50': selectedEmployeeId !== employee?.id}"
                        class="p-3 border-b border-gray-100 cursor-pointer transition-colors"
                    >
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-user text-blue-600"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold text-gray-800 truncate" x-text="employee.contact_info?.full_name || employee.username || 'Пользователь'"></h3>
                                <p class="text-xs text-gray-500 truncate" x-text="employee.contact_info?.position || ''"></p>
                            </div>
                            <template x-if="employee?.id && getUnreadCount(employee.id) > 0">
                                <span class="px-2 py-0.5 bg-blue-600 text-white text-xs rounded-full" x-text="getUnreadCount(employee.id)"></span>
                            </template>
                        </div>
                    </div>
                </template>
            </template>
        </div>
    </div>

    <!-- Правая панель - область чата -->
    <div class="flex-1 bg-white flex flex-col overflow-hidden">
        <template x-if="!currentChatId">
            <div class="flex-1 flex items-center justify-center text-gray-500">
                <div class="text-center">
                    <i class="fas fa-comments text-6xl mb-4 opacity-30"></i>
                    <p class="text-lg">{% trans "Выберите сотрудника для начала общения" %}</p>
                </div>
            </div>
        </template>
        
        <template x-if="currentChatId">
            <div class="flex-1 flex flex-col h-full">
                <!-- Заголовок чата -->
                <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-blue-600"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-800" x-text="selectedEmployee?.contact_info?.full_name || selectedEmployee?.username || 'Пользователь'"></h3>
                            <p class="text-xs text-gray-500" x-text="selectedEmployee?.contact_info?.position || ''"></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <template x-if="isTyping">
                            <span class="text-sm text-gray-500 italic">{% trans "Печатает..." %}</span>
                        </template>
                    </div>
                </div>

                <!-- Сообщения -->
                <div 
                    x-ref="messagesContainer"
                    class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50"
                >
                    <template x-for="(message, index) in (messages || [])" :key="`msg-${message?.id || index}-${index}`">
                        <template x-if="message">
                            <div>
                                <div 
                                    :class="message.sender?.id === currentUser?.id ? 'flex justify-end' : 'flex justify-start'"
                                >
                                    <div 
                                        :class="message.sender?.id === currentUser?.id ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border border-gray-200'"
                                        class="rounded-lg p-3 max-w-[70%] shadow-sm"
                                    >
                                        <p class="text-sm whitespace-pre-wrap" x-text="message.text || ''"></p>
                                        <div class="flex items-center justify-end gap-2 mt-2">
                                            <span 
                                                :class="message.sender?.id === currentUser?.id ? 'text-blue-100' : 'text-gray-500'"
                                                class="text-xs"
                                                x-text="formatTime(message.created_at)"
                                            ></span>
                                            <template x-if="message.sender?.id === currentUser?.id && message.is_read">
                                                <i class="fas fa-check-double text-blue-100 text-xs"></i>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <!-- Вложения -->
                                <template x-if="message.attachments && Array.isArray(message.attachments) && message.attachments.length > 0">
                                    <div 
                                        :class="message.sender?.id === currentUser?.id ? 'flex justify-end' : 'flex justify-start'"
                                        class="mt-1"
                                    >
                                        <div class="space-y-2 max-w-[70%]">
                                            <template x-for="(attachment, attIndex) in message.attachments" :key="`att-${attachment?.id || attIndex}-${attIndex}`">
                                                <template x-if="attachment">
                                                    <a 
                                                        :href="attachment.file_url || '#'"
                                                        target="_blank"
                                                        class="block p-2 bg-white rounded border border-gray-200 hover:bg-gray-50 transition-colors shadow-sm"
                                                    >
                                                        <div class="flex items-center gap-2">
                                                            <i class="fas fa-file text-gray-400"></i>
                                                            <span class="text-sm text-gray-700 truncate" x-text="attachment.original_filename || ''"></span>
                                                            <span class="text-xs text-gray-500 ml-auto flex-shrink-0" x-text="(attachment.file_size_mb || 0) + ' МБ'"></span>
                                                        </div>
                                                    </a>
                                                </template>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>
                </div>

                <!-- Форма отправки сообщения -->
                <div class="p-4 border-t border-gray-200 bg-white">
                    <form @submit.prevent="sendMessage()" class="flex gap-2">
                        <input 
                            type="file"
                            x-ref="fileInput"
                            @change="handleFileSelect"
                            multiple
                            class="hidden"
                        >
                        <button 
                            type="button"
                            @click="$refs.fileInput.click()"
                            class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors"
                            title="{% trans 'Прикрепить файл' %}"
                        >
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input 
                            type="text"
                            x-model="messageText"
                            @input="handleTyping()"
                            @keydown.enter.prevent="sendMessage()"
                            placeholder="{% trans 'Введите сообщение...' %}"
                            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                        <button 
                            type="submit"
                            :disabled="!messageText.trim() && selectedFiles.length === 0"
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                            title="{% trans 'Отправить сообщение' %}"
                        >
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                    <!-- Выбранные файлы -->
                    <template x-if="selectedFiles.length > 0">
                        <div class="mt-2 flex flex-wrap gap-2">
                            <template x-for="(file, index) in (selectedFiles || [])" :key="`file-${index}`">
                                <template x-if="file">
                                    <div class="flex items-center gap-2 px-3 py-1 bg-gray-100 rounded border border-gray-200">
                                        <i class="fas fa-file text-gray-400"></i>
                                        <span class="text-sm text-gray-700" x-text="file.name || ''"></span>
                                        <button 
                                            @click="removeFile(index)"
                                            class="text-red-500 hover:text-red-700"
                                        >
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </template>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>

<script>
function chatApp() {
    return {
        employees: [], // Список всех сотрудников
        filteredEmployees: [], // Отфильтрованный список сотрудников
        chats: [], // Кэш чатов для быстрого доступа
        chatsByEmployeeId: {}, // Маппинг employee_id -> chat
        currentChatId: null,
        selectedEmployeeId: null,
        selectedEmployee: null,
        messages: [],
        messageText: '',
        selectedFiles: [],
        searchQuery: '',
        currentUser: null,
        ws: null,
        isTyping: false,
        typingTimeout: null,

        async init() {
            // Получаем текущего пользователя
            await this.loadCurrentUser();
            
            // Загружаем список всех сотрудников
            await this.loadEmployees();
            
            // Загружаем существующие чаты для отображения непрочитанных сообщений
            await this.loadChats();
            
            // Подключаемся к WebSocket
            this.connectWebSocket();
        },

        async loadCurrentUser() {
            try {
                const response = await fetch('/api/users/me/', {
                    credentials: 'include'
                });
                if (response.ok) {
                    this.currentUser = await response.json();
                } else {
                    // Используем данные из контекста шаблона
                    const userDataElement = document.getElementById('current-user-data');
                    if (userDataElement) {
                        this.currentUser = JSON.parse(userDataElement.textContent);
                    } else {
                        this.currentUser = { id: 0, username: '' };
                    }
                }
            } catch (error) {
                console.error('Error loading current user:', error);
                // Используем данные из контекста шаблона
                const userDataElement = document.getElementById('current-user-data');
                if (userDataElement) {
                    this.currentUser = JSON.parse(userDataElement.textContent);
                } else {
                    this.currentUser = { id: 0, username: '' };
                }
            }
        },

        async loadEmployees() {
            try {
                // Загружаем всех сотрудников (пользователей с Contact)
                const response = await fetch('/api/users/', {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    // Обрабатываем пагинацию и фильтруем null значения
                    const allEmployees = Array.isArray(data) ? data : (data.results || []);
                    // Фильтруем текущего пользователя из списка и null значения
                    this.employees = allEmployees.filter(emp => emp != null && emp.id !== this.currentUser?.id);
                    this.filteredEmployees = this.employees;
                } else {
                    this.employees = [];
                    this.filteredEmployees = [];
                }
            } catch (error) {
                console.error('Error loading employees:', error);
                this.employees = [];
                this.filteredEmployees = [];
            }
        },

        async loadChats() {
            try {
                const response = await fetch('/api/chats/', {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    // Обрабатываем пагинацию: API может вернуть объект с results или массив напрямую
                    this.chats = Array.isArray(data) ? data : (data.results || []);
                    // Создаем маппинг employee_id -> chat
                    this.chatsByEmployeeId = {};
                    this.chats.forEach(chat => {
                        const otherParticipant = chat.other_participant;
                        if (otherParticipant) {
                            this.chatsByEmployeeId[otherParticipant.id] = chat;
                        }
                    });
                }
            } catch (error) {
                console.error('Error loading chats:', error);
                // Устанавливаем пустой массив в случае ошибки
                this.chats = [];
            }
        },

        filterEmployees() {
            if (!this.searchQuery.trim()) {
                this.filteredEmployees = Array.isArray(this.employees) ? this.employees : [];
                return;
            }
            const query = this.searchQuery.toLowerCase();
            const employees = Array.isArray(this.employees) ? this.employees : [];
            this.filteredEmployees = employees.filter(emp => {
                if (!emp) return false;
                const fullName = (emp.contact_info?.full_name || emp.username || '').toLowerCase();
                const position = (emp.contact_info?.position || '').toLowerCase();
                return fullName.includes(query) || position.includes(query);
            });
        },

        async selectEmployee(employee) {
            this.selectedEmployeeId = employee.id;
            this.selectedEmployee = employee;
            
            // Проверяем, есть ли уже чат с этим сотрудником
            let chat = this.chatsByEmployeeId[employee.id];
            
            if (!chat) {
                // Создаем новый чат
                try {
                    const response = await fetch(`/api/chats/get_or_create/?user_id=${employee.id}`, {
                        credentials: 'include'
                    });
                    if (response.ok) {
                        chat = await response.json();
                        this.chatsByEmployeeId[employee.id] = chat;
                        // Обновляем список чатов
                        await this.loadChats();
                    } else {
                        console.error('Error creating chat');
                        return;
                    }
                } catch (error) {
                    console.error('Error creating chat:', error);
                    return;
                }
            }
            
            this.currentChatId = chat.id;
            
            // Загружаем сообщения
            await this.loadMessages(chat.id);
            
            // Отмечаем сообщения как прочитанные
            await this.markChatAsRead(chat.id);
        },

        getUnreadCount(employeeId) {
            const chat = this.chatsByEmployeeId[employeeId];
            return chat ? (chat.unread_count || 0) : 0;
        },

        async loadMessages(chatId) {
            try {
                const response = await fetch(`/api/messages/?chat_id=${chatId}`, {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    // Фильтруем null/undefined значения и гарантируем, что это массив
                    this.messages = (Array.isArray(data) ? data : (data.results || [])).filter(msg => msg != null);
                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });
                } else {
                    // В случае ошибки устанавливаем пустой массив
                    this.messages = [];
                }
            } catch (error) {
                console.error('Error loading messages:', error);
                // В случае ошибки устанавливаем пустой массив
                this.messages = [];
            }
        },

        async sendMessage() {
            if (!this.messageText.trim() && this.selectedFiles.length === 0) {
                return;
            }

            const chatId = this.currentChatId;
            const text = this.messageText.trim();

            // Отправляем через WebSocket для real-time
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify({
                    type: 'chat_message',
                    chat_id: chatId,
                    text: text
                }));
            }

            // Отправляем файлы через API
            if (this.selectedFiles.length > 0) {
                await this.uploadFiles(chatId, text);
            }

            this.messageText = '';
            this.selectedFiles = [];
        },

        async uploadFiles(chatId, text) {
            const formData = new FormData();
            formData.append('chat', chatId);
            if (text) {
                formData.append('text', text);
            }

            this.selectedFiles.forEach((file, index) => {
                formData.append(`file_${index}`, file);
            });

            try {
                const response = await fetch('/api/messages/', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include',
                    headers: {
                        'X-CSRFToken': this.getCsrfToken()
                    }
                });

                if (response.ok) {
                    const message = await response.json();
                    // Инициализируем messages как массив, если он undefined
                    if (!Array.isArray(this.messages)) {
                        this.messages = [];
                    }
                    // Проверяем, что сообщение не null и не дублируется
                    if (message && message.id && !this.messages.find(msg => msg && msg.id === message.id)) {
                        this.messages.push(message);
                        this.$nextTick(() => {
                            this.scrollToBottom();
                        });
                    }
                }
            } catch (error) {
                console.error('Error uploading files:', error);
            }
        },

        handleFileSelect(event) {
            const files = Array.from(event.target.files);
            this.selectedFiles.push(...files);
        },

        removeFile(index) {
            this.selectedFiles.splice(index, 1);
        },


        async markChatAsRead(chatId) {
            try {
                await fetch(`/api/chats/${chatId}/mark_read/`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'X-CSRFToken': this.getCsrfToken()
                    }
                });
            } catch (error) {
                console.error('Error marking chat as read:', error);
            }
        },

        connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat/`;
            
            this.ws = new WebSocket(wsUrl);

            this.ws.onopen = () => {
                console.log('WebSocket connected');
            };

            this.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'chat_message') {
                        if (data.chat_id === this.currentChatId && data.message) {
                            // Инициализируем messages как массив, если он undefined
                            if (!Array.isArray(this.messages)) {
                                this.messages = [];
                            }
                            // Проверяем, что сообщение не null и не дублируется
                            const messageId = data.message.id;
                            if (messageId && !this.messages.find(msg => msg && msg.id === messageId)) {
                                this.messages.push(data.message);
                                this.$nextTick(() => {
                                    this.scrollToBottom();
                                });
                            }
                        }
                        // Обновляем список чатов для обновления счетчиков непрочитанных
                        this.loadChats();
                    } else if (data.type === 'typing_indicator') {
                        if (data.chat_id === this.currentChatId) {
                            this.isTyping = data.is_typing;
                            if (data.is_typing) {
                                clearTimeout(this.typingTimeout);
                                this.typingTimeout = setTimeout(() => {
                                    this.isTyping = false;
                                }, 3000);
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error parsing WebSocket message:', error);
                }
            };

            this.ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            this.ws.onclose = () => {
                console.log('WebSocket disconnected');
                // Переподключение через 3 секунды
                setTimeout(() => {
                    this.connectWebSocket();
                }, 3000);
            };
        },

        handleTyping() {
            if (this.ws && this.ws.readyState === WebSocket.OPEN && this.currentChatId) {
                this.ws.send(JSON.stringify({
                    type: 'typing',
                    chat_id: this.currentChatId,
                    is_typing: true
                }));

                clearTimeout(this.typingTimeout);
                this.typingTimeout = setTimeout(() => {
                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(JSON.stringify({
                            type: 'typing',
                            chat_id: this.currentChatId,
                            is_typing: false
                        }));
                    }
                }, 1000);
            }
        },

        scrollToBottom() {
            const container = this.$refs.messagesContainer;
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        },

        formatTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            
            if (minutes < 1) return '{% trans "Только что" %}';
            if (minutes < 60) return `${minutes} {% trans "мин назад" %}`;
            if (minutes < 1440) return `${Math.floor(minutes / 60)} {% trans "ч назад" %}`;
            
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        },

        getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'csrftoken') {
                    return value;
                }
            }
            return '';
        }
    }
}
</script>
{% endblock %}
