version: '3.8'

services:
  # База данных теперь внутри проекта
  db-hr:
    image: postgres:17.2
    container_name: hr-guide-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr-guide
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Postgres9007
    volumes:
      - hr-guide-db-data:/var/lib/postgresql/data
    networks:
      - hr-guide-network

  # Django приложение
  hr-guide-web:
    build: .
    container_name: hr-guide-web
    restart: unless-stopped
    # Используем Gunicorn для скорости
    command: gunicorn hr_guide.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --keep-alive 5 --access-logfile /dev/null
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8880:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # Теперь подключаемся к соседнему контейнеру db-hr
      - DATABASE_HOST=db-hr
      - DATABASE_PORT=5432
      - DATABASE_NAME=hr-guide
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=Postgres9007
    depends_on:
      - db-hr
    networks:
      - hr-guide-network

networks:
  hr-guide-network:
    driver: bridge

volumes:
  hr-guide-db-data: # Данные БД будут храниться здесь